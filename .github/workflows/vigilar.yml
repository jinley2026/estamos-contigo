# Vigilante de fuentes oficiales cada 10 minutos. NO publica nada: abre un aviso (issue) para el equipo
# cuando una página oficial cambia y menciona el suceso. Una persona verifica y publica.
# GitHub puede retrasar las ejecuciones programadas unos minutos en momentos de carga.
name: Vigilar fuentes oficiales
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency: vigilancia
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar fuentes
        id: revisar
        run: |
          set +e
          node scripts/vigilar-fuentes.mjs
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Guardar estado de la vigilancia
        run: |
          git config user.name "vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add vigilancia/
          git diff --cached --quiet || git commit -m "Vigilancia: estado $(date -u +%H:%M)" && git push
      - name: Avisar al equipo
        if: steps.revisar.outputs.codigo == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Fuente oficial con cambios — ${new Date().toISOString().slice(11,16)} UTC`,
              body: fs.readFileSync('vigilancia/ultimo-informe.md', 'utf8') + '\n\nVerificar, publicar siguiendo docs/operacion/procedimientos.md y cerrar este aviso.',
              labels: ['verificar']
            });
